; ============================================
; Production Grade PHP user.ini Configuration
; ============================================

; -----------------------
; Error Handling
; -----------------------
display_errors = on
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
html_errors = on
error_log = /var/www/php_error



; -----------------------
; Resource Limits
; -----------------------
memory_limit = 1900M
max_execution_time = 120
max_input_time = 120
max_input_vars = 5000
post_max_size = 128M
upload_max_filesize = 128M

; -----------------------
; Session Security
; -----------------------
session.use_strict_mode = 1
session.use_only_cookies = 1
session.cookie_httponly = 1
session.cookie_secure = 1
session.cookie_samesite = Lax
session.gc_maxlifetime = 1440
session.save_path = "/tmp/php-sessions"

; -----------------------
; File Upload Security
; -----------------------
file_uploads = On
max_file_uploads = 20

; -----------------------
; Disable Dangerous Functions
; Uncomment if your app does not require them
; -----------------------
disable_functions = exec,passthru,shell_exec,system,proc_open,popen,curl_multi_exec,parse_ini_file,show_source

; -----------------------
; PHP Exposure
; -----------------------
expose_php = Off

; -----------------------
; Path Restrictions
; Adjust according to your environment
; -----------------------
; open_basedir = /var/www/:/tmp/

; -----------------------
; OPcache (if supported)
; Some shared hosts ignore these
; -----------------------
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
opcache.save_comments = 1
opcache.fast_shutdown = 1

; -----------------------
; Timezone
; -----------------------
date.timezone = Africa/Lagos

; -----------------------
; Security Hardening
; -----------------------
allow_url_fopen = Off
allow_url_include = Off
cgi.fix_pathinfo = 0

; -----------------------
; Realpath Cache
; -----------------------
realpath_cache_size = 4096K
realpath_cache_ttl = 600

; -----------------------
; Output Buffering
; -----------------------
output_buffering = 4096
zlib.output_compression = On

; -----------------------
; Default Charset
; -----------------------
default_charset = "UTF-8"

; -----------------------
; Assertion Handling
; -----------------------
assert.active = 0

; -----------------------
; Mail Security
; -----------------------
mail.add_x_header = Off

; -----------------------
; Temporary Directories
; -----------------------
upload_tmp_dir = /tmp
sys_temp_dir = /tmp
